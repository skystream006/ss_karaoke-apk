name: Version Bump on PR Merge

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

jobs:
  version-bump:
    name: Bump patch version (XX)
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version in app/build.gradle
        id: bump
        run: |
          FILE="app/build.gradle"

          # Read current versionName (expected format: 1.00.XX)
          CURRENT=$(grep -oP '(?<=versionName ")[\d.]+(?=")' "$FILE")
          echo "Current version: $CURRENT"

          # Extract major.minor and patch parts
          MAJOR_MINOR=$(echo "$CURRENT" | grep -oP '^\d+\.\d+')
          PATCH=$(echo "$CURRENT" | grep -oP '\d+$')

          # Increment patch
          NEW_PATCH=$((10#$PATCH + 1))
          # Zero-pad to two digits
          NEW_PATCH_PADDED=$(printf "%02d" $NEW_PATCH)
          NEW_VERSION="${MAJOR_MINOR}.${NEW_PATCH_PADDED}"
          echo "New version: $NEW_VERSION"

          # Update versionName
          sed -i "s/versionName \"$CURRENT\"/versionName \"$NEW_VERSION\"/" "$FILE"

          # Increment versionCode
          CURRENT_CODE=$(grep -oP '(?<=versionCode )\d+' "$FILE")
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" "$FILE"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} (versionCode ${{ steps.bump.outputs.new_version_code }})"
          # Pull with rebase to handle concurrent PR merges gracefully
          git pull --rebase origin main
          git push origin main
