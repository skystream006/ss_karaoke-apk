name: Build APK

on:
  workflow_run:
    workflows: [ "Version Bump on PR Merge" ]
    types: [ completed ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache writes require a token with write scopes, which is not
          # available for pull requests from forks or workflow_run events.
          cache-read-only: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle | awk -F'"' '{print $2}')
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ss-karaoke-${VERSION}.apk
          echo "APK_PATH=app/build/outputs/apk/debug/ss-karaoke-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ss-karaoke-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30
